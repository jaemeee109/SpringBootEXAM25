buildscript {
    ext {
        queryDslVersion = "5.0.0"
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.exam'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf' /* 프론트 관련 */
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.1.0' /* 프론트 layout 관련 */

    implementation("net.coobird:thumbnailator:0.4.16")

    implementation 'org.springframework.boot:spring-boot-starter-web' /* String-Web */
    compileOnly 'org.projectlombok:lombok' /* lombok */
    annotationProcessor 'org.projectlombok:lombok' /* lombok */
    testCompileOnly 'org.projectlombok:lombok'/* lombok */
    testAnnotationProcessor 'org.projectlombok:lombok'/* lombok */

    // https://mvnrepository.com/artifact/org.modelmapper/modelmapper
    implementation 'org.modelmapper:modelmapper:3.1.0'


    developmentOnly 'org.springframework.boot:spring-boot-devtools' /* 부트개발용 */

    /* 1,2 단계 설정 -> src/main/resources/application.properties 에서 설정됨 */

    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client' /* maria 드라이버 */
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' /* 데이터 베이스 관련 */

    testImplementation 'org.springframework.boot:spring-boot-starter-test' /* jUnit 테스트 */
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' /* jUnit용 코드 */

    /* 쿼리dsl 문구 추가  */
    implementation "com.querydsl:querydsl-jpa:${queryDslVersion}:jakarta"

    annotationProcessor(
            "jakarta.persistence:jakarta.persistence-api",
            "jakarta.annotation:jakarta.annotation-api",
            "com.querydsl:querydsl-apt:${queryDslVersion}:jakarta")

    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.springframework.boot:spring-boot-starter-validation'


}

tasks.named('test') {
    useJUnitPlatform()
}

/* 쿼리dsl 문구 추가 */
sourceSets {

    main {
        java {
            srcDirs = ["$projectDir/src/main/java", "$projectDir/build/generated"]
        }
    }
}



compileJava.dependsOn('clean')
