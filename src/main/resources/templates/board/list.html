<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/basic.html}">

<div layout:fragment="content">
  <!--<h1> 게시판 리스트 페이지 </h1>-->
  <div class="row mt-3">
    <!--검색용 form 처리 -->
    <form action="/board/list" method="get">
      <div class="col">
        <input type="hidden" name="size" th:value="${pageRequestDTO.size}">
        <div class="input-group">
          <div class="input-group-prepend">
            <select class="form-select" name="type">
              <option value="">검색시클릭</option>
              <option value="t" th:selected="${pageRequestDTO.type=='t'}">제목</option>
              <option value="c" th:selected="${pageRequestDTO.type=='c'}">내용</option>
              <option value="w" th:selected="${pageRequestDTO.type=='w'}">작성자</option>
              <option value="tc" th:selected="${pageRequestDTO.type=='tc'}">제목&내용</option>
              <option value="tw" th:selected="${pageRequestDTO.type=='tw'}">제목&작성자</option>
              <option value="tcw" th:selected="${pageRequestDTO.type=='tcw'}">제목&내용&작성자</option>
            </select>
          </div> <!-- 검색 리스트 박스 종료 -->

          <input type="text" class="form-control" name="keyword" th:value="${pageRequestDTO.keyword}">
          <div class="input-group-append">
            <button class="btn btn-outline-secondary searchBtn" type="submit">검색</button>
            <button class="btn btn-outline-secondary clearBtn" type="button">비우기</button>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            * 욕설금지
          </div>
          <div class="card-body">
            <h5 class="card-title">마법의 소라고동에게 물어봐</h5>
            <!--테이블 영역-->
            <table class="table">
              <thead>
              <tr>
                <th scope="col">bno</th>
                <th scope="col">제목</th>
                <th scope="col">작성자</th>
                <th scope="col">등록일</th>
              </tr>
              </thead>

              <tbody th:with="link=${pageRequestDTO.getLink()}">
              <tr th:each="dto:${responseDTO.dtoList}">
                <th scope="row">[[${dto.bno}]]</th>
                <td>
                  <a th:href="|@{/board/read(bno =${dto.bno})}&${link}|">[[${dto.title}]] </a>
                </td>
                <td>[[${dto.writer}]]</td>
                <td>[[${#temporals.format(dto.regDate,'yyyy-MM-dd')}]]</td>
              </tr>
              </tbody>

            </table>
            <!-- 페이징 처리용 아이콘 -->
            <div class="float-end">
              <ul class="pagination flex-wrap">
                <li class="page-item" th:if="${responseDTO.prev}">
                  <a class="page-link" th:data-num="${responseDTO.start -1}">이전페이지</a>
                </li>
                <th:block th:each="i:${#numbers.sequence(responseDTO.start,responseDTO.end)}">

                  <li th:class="${responseDTO.page == i}?'page-item active':'page-item'">
                    <a class="page-link" th:data-num="${i}">[[${i}]]</a>
                  </li> <!--  [1] [2] [3] ......  -->
                </th:block>
                <li class="page-item" th:if="${responseDTO.next}">
                  <a class="page-link" th:data-num="${responseDTO.end + 1}">다음페이지</a>
                </li>

              </ul>

            </div>

          </div>
        </div>
      </div>
    </form> <!--form 종료-->
  </div>
</div>

<script layout:fragment="script" th:inline="javascript">


  document.querySelector(".pagination").addEventListener("click",function (e){
    e.preventDefault()
    e.stopPropagation()

    const target = e.target

    if(target.tagName !== 'A'){
      return
    }//if종료
    const num = target.getAttribute("data-num")


    const formObj = document.querySelector("form")
    formObj.innerText += `<input type='hidden' name='page' value='${num}'>`

    formObj.submit()

  },false) //버블링



  document.querySelector(".clearBtn").addEventListener("click",function (e){
    e.preventDefault()
    e.stopPropagation()
    self.location='/board/list'
  },false)


  const result = [[${result}]]
  if(result){
    alert(result)
  }
  document.querySelector(".pagination").addEventListener("click", function(e) {
    e.preventDefault();

    const target = e.target;
    if (target.tagName !== 'A') {
      return;
    }

    const num = target.getAttribute("data-num");
    const formObj = document.querySelector("form");

    // 기존에 있던 page input이 있으면 삭제 (중복 방지)
    const existingInput = formObj.querySelector("input[name='page']");
    if (existingInput) {
      existingInput.remove();
    }

    // 새 hidden input 생성
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = "page";
    input.value = num;

    formObj.appendChild(input);

    formObj.submit();
  });

  console.log("자바스크립트 fragment 테스트.....")
</script>
