<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/basic.html}">
<head>
  <title>마법의 소라고동</title>
</head>
<div layout:fragment="content">
  <div class="row mt-3">
    <div class="col">
      <div class="card">
        <div class="card-header">
          질문글 수정하기
        </div>
        <div class="card-body">
          <form th:action="@{/board/modify}" method="post" id="f1">
            <div class="input-group mb-3">
              <span class="input-group-text">번호</span>
              <input type="text" class="form-control" th:value="${dto.bno}"name="bno"readonly>
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">제목</span>
              <input type="text" class="form-control" name="title"th:value="${dto.title}">
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">내용</span>
              <textarea class="form-control col-sm-5" rows="5"name="content">[[${dto.content}]]
</textarea>
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">작성자</span>
              <input type="text" class="form-control" th:value="${dto.writer}"name="writer"readonly>
            </div>


              <div class="input-group mb-3">
                  <span class="input-group-text">이미지</span>
                  <div class="float-end uploadHidden">
                      <button type="button" class="btn btn-primary uploadFileBtn">파일첨부</button>
                  </div>
              </div>

            <div class="input-group mb-3">
              <span class="input-group-text">등록일</span>
              <input type="text" class="form-control" th:value="${#temporals.format(dto.regDate,'yyyy-MM-dd HH:mm:ss')}" readonly>
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">수정일</span>
              <input type="text" class="form-control" th:value="${#temporals.format(dto.modDate,'yyyy-MM-dd HH:mm:ss')}" readonly>
            </div>
            <div class="my-4">
              <div class="float-end">
                <button type="button" class="btn btn-primary listBtn">목록</button>
                <button type="button" class="btn btn-secondary modBtn">수정</button>
                <button type="button" class="btn btn-danger removeBtn">삭제</button>
              </div>
            </div>
          </form>
        </div><!--end card body-->
      </div><!--end card-->
    </div><!-- end col-->
  </div><!-- end row-->

    <!-- 첨부 파일 썸네일 -->
    <div class="row mt-3">
        <div class="col ">
            <div class="container-fluid d-flex uploadResult" style="flex-wrap: wrap;">
                <th:block th:each="fileName:${dto.fileNames}">
                    <div class="card col-4" th:with = "arr = ${fileName.split('_')}">
                        <div class="card-header d-flex justify-content-center">
                            [[${arr[1]}]]
                            <button class="btn-sm btn-danger"
                                    th:onclick="removeFile([[${arr[0]}]], [[${arr[1]}]], this)">X</button>
                        </div>
                        <div class="card-body">
                            <img th:src="|/view/s_${fileName}|" th:data-src="${fileName}" >
                        </div>
                    </div><!-- card -->
                </th:block>
            </div>
        </div>
    </div>

    <!--추가 첨부파일 모달 -->
    <div class="modal uploadModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Upload File</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="input-group mb-3">
                        <input type="file" name="files" class="form-control" multiple >
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary uploadBtn">Upload</button>
                    <button type="button" class="btn btn-outline-dark closeUploadBtn" >Close</button>
                </div>
            </div>
        </div>
    </div><!-- modify modal -->


    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/upload.js"></script>

</div>

<script layout:fragment="script" th:inline="javascript">

 // 유효성 검사 오류 처리
  const errors = [[${errors}]]
  console.log(errors)
  let errorMsg = ''
  if(errors){
    for (let i = 0; i < errors.length; i++){
      errorMsg += `$(errors[i].field)은(는) $(errors[i].code)\n`
    } //for  종료
    history.replaceState({},null,null)
    alert(errorMsg) // 오류메시지 팝업 표시
  }// if종료

 // 페이지 링크처리
  const link = [[${pageRequestDTO.getLink()}]]
  const formObj = document.querySelector("#f1")

 // 수정 버튼
  document.querySelector(".modBtn").addEventListener("click",function (e){
    e.preventDefault()
    e.stopPropagation()

      appendFileData()

    formObj.action = `/board/modify?${link}`
    formObj.method = 'post'
    formObj.submit()
  },false)

 // 삭제 버튼
  document.querySelector(".removeBtn").addEventListener("click", function (e){
    e.preventDefault()
    e.stopPropagation()
    formObj.action = `/board/remove`
    formObj.method = 'post'
    formObj.submit()
  }, false)

 // 목록 버튼
  document.querySelector(".listBtn").addEventListener("click", function (e){
    e.preventDefault()
    e.stopPropagation()

    formObj.reset()
    self.location =`/board/list?${link}`
  },false)

// 삭제된 파일 목록 저장
  const removeFileList = []

 // 첨부파일 1개 삭제 처리
  function removeFile(uuid,fileName,obj){
      if(!confirm("파일을 삭제하시겠습니까?")){
          return
      }
      console.log(uuid)
      console.log(fileName)

      console.log(obj)

      removeFileList.push({uuid,fileName}) // 삭제 목록에 추가

      const targetDiv = obj.closest(".card")
      targetDiv.remove() // 화면에서 제거
  } // removeFileList



// 파일 업로드 모달 창
  const uploadModal = new bootstrap.Modal(document.querySelector(".uploadModal"))

 // 추가 첨부 버튼 눌렀을때
  document.querySelector(".uploadFileBtn").addEventListener("click", function(e){

      e.stopPropagation()
      e.preventDefault()
      uploadModal.show()

  }, false)

 // 모달 업로드 버튼
  document.querySelector(".uploadBtn").addEventListener("click", function(e){

      const formObj = new FormData();

      const fileInput = document.querySelector("input[name='files']")

      console.log(fileInput.files)

      const files = fileInput.files

      // 선택 파일 FormData에 추가
      for (let i = 0; i < files.length; i++) {
          formObj.append("files", files[i]);
      }

        // 서버로 업로드 요청 후 결과물 프론트에 표시
      uploadToServer(formObj).then(result => {
          console.log(result)
          //console.log(result)
          for (const uploadResult of result) {
              showUploadFile(uploadResult)
          }
          uploadModal.hide()
      }).catch(e => {
          uploadModal.hide()
      })

  },false)

// 프론트에 표시하기위해 uploadResult 를 저장
  const uploadResult = document.querySelector(".uploadResult")


 // 업로드된 파일을 프론트에 표시
  function showUploadFile({uuid, fileName, link}){

      const str =`<div class="card col-4">
            <div class="card-header d-flex justify-content-center">
                ${fileName}
                <button class="btn-sm btn-danger" onclick="javascript:removeFile('${uuid}', '${fileName}', this)" >X</button>
            </div>
            <div class="card-body">
                 <img src="/view/${link}" data-src="${uuid+"_"+fileName}" >
            </div>
        </div><!-- card -->`

      uploadResult.innerHTML += str
  }


  function appendFileData(){

      const target = document.querySelector(".uploadHidden")
      const uploadFiles = uploadResult.querySelectorAll("img")

      let str = ''

      for (let i = 0; i < uploadFiles.length ; i++) {
          const uploadFile = uploadFiles[i]
          const imgLink = uploadFile.getAttribute("data-src")

          str += `<input type='hidden' name='fileNames' value="${imgLink}">`
      }

      target.innerHTML = str;

  }

// 서버에 삭제 요청 전송
  function callRemoveFiles(){

      removeFileList.forEach( ({uuid,fileName}) => {
          removeFileToServer({uuid, fileName})
      })
  }

// 프론트에서는 제거 됐지만 서버에는 아직 전달 안된 파일 보냄
  function appendNotShownData(){

      if(removeFileList.length == 0){
          return
      }

      const target = document.querySelector(".uploadHidden")
      let str = ''

      for (let i = 0; i < removeFileList.length ; i++) {

          const {uuid, fileName} = removeFileList[i];

          str += `<input type='hidden' name='fileNames' value="${uuid}_${fileName}">`
      }
      target.innerHTML += str;
  }


</script>
