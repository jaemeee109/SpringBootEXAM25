<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/basic.html}">
<head>
  <meta charset="UTF-8">
  <title>마법의 소라고동에게 물어봐</title>
</head>

<div layout:fragment="content">
  <div class="row mt-3">
    <div class="col">
      <div class="card">
        <div class="card-header">
          소라고동에게 묻고싶은 말?
        </div>
        <div class="card-body">
          <form action="/board/register" method="post">
            <div class="input-group mb-3">
              <span class="input-group-text"></span>
              <input type="text" name="title" class="form-control" placeholder="Title">
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">내용</span>
              <textarea class="form-control col-sm-5" rows="5" name="content"></textarea>
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">작성자</span>
              <input type="text" name="writer" class="form-control" placeholder="Writer">
            </div>
            <div class="my-4">
              <div class="float-end">
                <button type="submit" class="btn btn-primary">등록</button>
                <button type="reset" class="btn btn-secondary">등록안함</button>
              </div>
            </div>
          </form>
        </div><!-- end card body-->
      </div><!--end card-->
    </div><!--end col-->
  </div><!--end row-->

  <!-- p.494 추가-->
  <div class="modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Modal title</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>Modal body text goes here</p>
        </div>
        <div class="modal-footer">
          <button type="button" class ="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class ="btn btn-primary">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

</div><!-- end layout fragment-->

<script layout:fragment="script" th:inline="javascript">

  const errors = [[${errors}]];
  console.log(errors);

  let errorMsg = '';
  if(errors && errors.length > 0) {
    for (let i = 0; i < errors.length; i++) {
      errorMsg += `${errors[i].field}은(는) ${errors[i].defaultMessage} \n`;
    }
    alert(errorMsg);
  }


  const result = [[${result}]];
  const modal = new bootstrap.Modal(document.querySelector(".modal"));
  if(result && result !== "") {
    modal.show();
  }
</script>
