<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><!-- * 필수 * thymeleaf용 프론트로 연동됨-->
<head>
    <meta charset="UTF-8">
    <title>리스트 사용</title>
</head>
<body>
  <h4>[[${list}]]</h4> <!-- 인라인 표현법 : 태그 안쪽에 사용할 때 -->
  <hr>
  <h4 th:text="${list}"></h4><!-- 태그 속성으로 사용-->
  <hr>
  <div th:with="num1=${10},num2=${20}"> <!--임시 변수 선언-->
    <h4 th:text="${num1+num2}"></h4><!--표현식 안에서 계산이 됨-->
  </div>
  <hr>
  <br>
<!-- 반복 문 처리 방법 list -> str -->
<!-- 반복이 필요한 태그에 th:each 적용 (향상된 for) -->
  <ul>
    <li th:each="str:${list}" th:text="${str}"></li>
  </ul> <!-- 태그 안에 속성 값으로 반복문을 사용 -->
<!-- th:block 별도의 태그로 사용도 가능-->
<hr>
<br>
  <ul>
    <th:blcok th:each="str:${list}">
      <li>[[${str}]]</li>
    </th:blcok>
  </ul>
  <hr>
  <br>
<!-- 반복문에서 상태값을 가지고 있는 특수 기능 -->
<!-- th:each를 처리할 때 내부 상태에 변수를 추가해서 사용 가능 -->
<!-- status 변수 ->  index/count/size/first/last/odd/even 값을 사용 가능 -->
<ul>
  <li th:each="str,status:${list}">
     status.index     리스트의 값<br>
  [[${status.index}]] -- [[${str}]]
  </li>
</ul>
<ul>
  <li th:each="str,status:${list}">
    status.count    리스트의 값<br>
    [[${status.count}]] -- [[${str}]]
  </li>
</ul>
  <hr>
  <br>
<!-- 삼항 연산자용 코드 (조건) ? 참 : 거짓-->
<ul>
  <li th:each="str,status:${list}">
    <span th:text="${status.odd}? '홀수==>'+${str}"></span>
  </li>
</ul>
  <hr>
  <br>
<!-- 스위치 문 활용법 -->
<ul>
  <li th:each="str,status:${list}">
    <th:block th:switch="${status.index%3}"><!--인덱스를 3으로 나누었을때 나머지 값-->
      <span th:case="0">인덱스를 3으로 나누었을때 나머지가 0입니다 </span>
      <span th:case="1">인덱스를 3으로 나누었을때 나머지가 1입니다 </span>
      <span th:case="2">인덱스를 3으로 나누었을때 나머지가 2입니다 </span>
    </th:block>
  </li>
</ul>
  <hr>
  <br>
<!-- 타임 리프 링크 처리 -->
<!-- jsp는 링크처리할 때 톰캣이 context-root를 프로젝트 명으로 생성하기 때문에 많은 문제가 있다-->
<!-- @로 링크를 작성하기만 하면 context-root를 알아온다 (톰캣 내장이기 때문에 가능)-->
<a th:href="@{/hello}"> 컨트롤러에서 hello 경로를 찾는다 </a>
  <hr>
  <br>
<!-- 링크의 쿼리스트링 처리 방법 -->
<a th:href="@{/hello(name='신짱구',age=5)}">클릭 후 URL을 확인하세요</a>
<!-- 링크 한글 처리 TEST 성공 -> http://192.168.111.105/hello?name=신짱구&age=5  -->
  <hr>
  <br>
<!-- 링크가 배열일 경우 자동으로 같은 이름의 파라미터 처리를 한다
<a th:href="@{/hello(type=${{'망고','복숭아','샤인머스캣','포도'}})">클릭 후 URL확인</a>-->


  <hr>
  <br>




</body>
</html>
